# ============================================================
# CONFIGURACION DE SPRING BOOT - CLINICAPP
# ============================================================

spring.application.name=clinicapp-api

# ============================================================
# CONFIGURACION DE BASE DE DATOS (MySQL con XAMPP)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/clinica_db?useSSL=false&serverTimezone=America/Guatemala&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# CONFIGURACION DE JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================================
# CONFIGURACION DEL PUERTO DEL SERVIDOR
# ============================================================
server.port=8080
server.servlet.context-path=/api

# ============================================================
# CONFIGURACION DE LOGGING
# ============================================================
logging.level.com.clinicapp=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/clinicapp.log
logging.file.max-size=10MB
logging.file.max-history=7

# ============================================================
# CONFIGURACION DE SEGURIDAD (JWT)
# ============================================================
jwt.secret=ClinicaAppSecretKey2026ParaFirmaDeTokensJWT
jwt.expiration=86400000
jwt.issuer=ClinicaApp

# ============================================================
# CONFIGURACION DE CORS (para Angular y otros clientes)
# ============================================================
cors.allowed.origins=http://localhost:4200,http://localhost:4300,http://localhost:8080

# ============================================================
# CONFIGURACION DE JACKSON (Serializacion JSON)
# ============================================================
spring.jackson.time-zone=America/Guatemala
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# ============================================================
# CONFIGURACION DE MANEJO DE EXCEPCIONES
# ============================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# ============================================================
# CONFIGURACION DE MULTIPART (para subida de archivos)
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true